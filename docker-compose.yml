services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shorts-os-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shorts_os
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shorts_os"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
